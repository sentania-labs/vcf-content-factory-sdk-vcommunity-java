# adapter.yaml: pak metadata for VCF Content Factory vCommunity.
#
#   adapter_kind  MUST equal the AdapterKind key in describe.xml and
#                 ADAPTER_KIND in VCommunityAdapter.java.
#   build_number  bump on every build; CHANGELOG.md gets a matching line.
#   released      false while authoring; the official release is the .pak
#                 CI builds on a v* git tag. Dev builds stamp 0.0.0.<build>.
#
# Design: docs/design/vcommunity-java-port-design.md (identity in section 1).
adapter_kind: vcfcf_vcommunity
entry_class: com.vcfcf.adapters.vcommunity.VCommunityAdapter
name: VCF Content Factory vCommunity
description: >
  Java port of the vCommunity management pack. Reads a vCenter over vim25 and
  pushes the vCommunity| keys onto the vCenter adapter's own objects through
  the VCF Operations Suite API, and adds three objects of its own (content
  libraries, library items and VM templates). Port of vCommunity by Onur
  Yuzseven (github.com/vmbro/VCF-Operations-vCommunity) as continued by
  e1-rahabok (github.com/e1-rahabok/VCF-vCommunity-Adapter) 0.8.1.
  This build collects the property keys of clusters, hosts, virtual machines,
  datastores and the vCenter, and delivers the content libraries, their items
  and the VM templates as objects of its own; the derived metrics, the guest
  checks and the content come in later phases.
version: 1.0.0
build_number: 8
tier: 2
released: false

vendor: "VCF Content Factory"
eula_file: LICENSE

# The pak's content keeps the original pack's names; none carries a prefix.
content_naming: unprefixed
# Bundled content (a later phase) targets the vCenter adapter's own kinds and
# the Container kinds, where the keys are stitched, not objects of this kind.
content_foreign_adapter_kinds: [VMWARE, Container]

# Where the keys land. Documentation only: the groups are the exact prefixes.
# This build pushes the property keys (phase P2) and the Collection Health keys;
# the rest are listed in the design and are filled in as the collectors arrive.
# docs/p2-key-coverage.tsv and docs/p3-key-coverage.tsv count every key of the key
# map against the tests (P3: the 26 keys of the three own kinds).
stitch_targets:
  - adapter_kind: VMWARE
    resource_kind: VMwareAdapter Instance
    identity: "VMEntityVCID (the vCenter's about.instanceUuid); exactly one object must carry it, otherwise the keys are held back and counted"
    key_groups:
      - "vCommunity|Certificate|*"
      - "vCommunity|Configuration|*"
      - "vCommunity|Collection Health|*"
  - adapter_kind: VMWARE
    resource_kind: ClusterComputeResource
    identity: "VMEntityObjectID + VMEntityVCID (the MoRef and the vCenter's instance UUID, never a name)"
    key_groups:
      - "vCommunity|Cluster Configuration|*"
  - adapter_kind: VMWARE
    resource_kind: HostSystem
    identity: "VMEntityObjectID + VMEntityVCID"
    key_groups:
      - "vCommunity|Configuration|*"
      - "vCommunity|Licensing:<license name>|*"
      - "vCommunity|Storage Adapter|*"
      - "vCommunity|Storage Adapter:<hba>|*"
      - "vCommunity|Network|*"
      - "vCommunity|Network|Device:<vmnic>|*"
      - "vCommunity|Runtime|*"
      - "vCommunity|Hardware|*"
      - "vCommunity|Capability|*"
  - adapter_kind: VMWARE
    resource_kind: VirtualMachine
    identity: "VMEntityObjectID + VMEntityVCID"
    key_groups:
      - "vCommunity|Configuration|*"
      - "vCommunity|Guest|*"
      - "vCommunity|Runtime|*"
      - "vCommunity|Summary|*"
      - "vCommunity|Network|Network Adapters:<label>|*"
      - "vCommunity|Virtual Disk:<label>|*"
      - "vCommunity|Options|*"
  - adapter_kind: VMWARE
    resource_kind: Datastore
    identity: "VMEntityObjectID + VMEntityVCID"
    key_groups:
      - "vCommunity|Identifiers|*"
      - "vCommunity|Summary|*"
