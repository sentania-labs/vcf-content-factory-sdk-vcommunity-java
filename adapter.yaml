# adapter.yaml: pak metadata for VCF Content Factory vCommunity.
#
#   adapter_kind  MUST equal the AdapterKind key in describe.xml and
#                 ADAPTER_KIND in VCommunityAdapter.java.
#   version       the release line: 3.x is this port (Onur's pack is 1.x, Ewan's 2.x).
#   build_number  bump on every build; CHANGELOG.md gets a matching line. It is carried
#                 forward across a version change (development builds 1 to 26 were under
#                 1.0.0; the first release is 3.0.0 build 27), so a dev build never stamps
#                 a lower number than one already installed; the release tag is
#                 v<version>.<build_number>.
#   released      false while authoring; the official release is the .pak
#                 CI builds on a v* git tag. Dev builds stamp 0.0.0.<build>.
#
# Design: docs/design/vcommunity-java-port-design.md (identity in section 1).
adapter_kind: vcfcf_vcommunity
entry_class: com.vcfcf.adapters.vcommunity.VCommunityAdapter
name: VCF Content Factory vCommunity
description: >
  Java port of the vCommunity management pack. Reads a vCenter over vim25 and
  pushes the vCommunity| keys onto the vCenter adapter's own objects through
  the VCF Operations Suite API, and adds three objects of its own (content
  libraries, library items and VM templates). Port of vCommunity by Onur
  Yuzseven (github.com/vmbro/VCF-Operations-vCommunity) as continued by
  e1-rahabok (github.com/e1-rahabok/VCF-vCommunity-Adapter) 0.8.1.
  This build collects the property keys of clusters, hosts, virtual machines,
  datastores and the vCenter, delivers the content libraries, their items and
  the VM templates as objects of its own, and computes the derived metrics
  (the cluster, host and VM scores, availability, network speed, the periodic
  cluster check, the vSphere World and Business Application figures), and,
  when switched on in the account (both are off by default), asks the Windows
  guests of the vCenter for their operating system, their services and their
  event logs and sends the events. The pak also ships the content of the original
  pack (views, dashboards, reports, super metrics, symptoms, alerts and a
  recommendation) and the six check-list files.
version: 3.0.0
build_number: 27
tier: 2
released: false

vendor: "VCF Content Factory"
# The pak's eula.txt: NOTICE (source, license and terms of the bundled content) followed by the
# MIT text of LICENSE. Keep it equal to NOTICE + LICENSE when either changes.
eula_file: EULA.txt

# The pak's content keeps the original pack's names; none carries a prefix.
content_naming: unprefixed
# Bundled content (phase P6). The symptoms, alerts and recommendation all sit on
# VMWARE objects, where the keys are stitched, not objects of this kind; the builder
# checks only those against this list (the views and dashboards that name VMSP,
# APPLICATIONDISCOVERY or Container subjects are not checked by it).
content_foreign_adapter_kinds: [VMWARE]

