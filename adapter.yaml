# Where the keys land. Documentation only: the groups are the exact prefixes.
# This build pushes the property keys (phase P2), the derived metrics (phase P4),
# the guest keys of Windows VMs (phase P5, only when switched on) and the
# Collection Health keys; the rest are listed in the design and are filled
# in as the collectors arrive.
# docs/p2-key-coverage.tsv, docs/p3-key-coverage.tsv, docs/p4-key-coverage.tsv and
# docs/p5-key-coverage.tsv count every key of the key map against the tests (P3:
# the 26 keys of the three own kinds; P4: the 74 derived rows; P5: the 9 guest rows).
stitch_targets:
  - adapter_kind: VMWARE
    resource_kind: VMwareAdapter Instance
    identity: "VMEntityVCID (the vCenter's about.instanceUuid); exactly one object must carry it, otherwise the keys are held back and counted"
    key_groups:
      - "vCommunity|Certificate|*"
      - "vCommunity|Configuration|*"
      - "vCommunity|Collection Health|*"
      - "vCommunity|Availability|Worst Cluster Operational Availability"
      - "vCommunity|Number of Port Groups"
  - adapter_kind: VMWARE
    resource_kind: ClusterComputeResource
    identity: "VMEntityObjectID + VMEntityVCID (the MoRef and the vCenter's instance UUID, never a name)"
    key_groups:
      - "vCommunity|Cluster Configuration|*"
      - "vCommunity|Cluster Performance|*"
      - "vCommunity|Cluster Risk|*"
      - "vCommunity|Cluster Consumption|*"
      - "vCommunity|Availability|*"
      - "vCommunity|Periodic Cluster Check|*"
      - "vCommunity|Resource Pools|*"
  - adapter_kind: VMWARE
    resource_kind: HostSystem
    identity: "VMEntityObjectID + VMEntityVCID"
    key_groups:
      - "vCommunity|Configuration|*"
      - "vCommunity|Licensing:<license name>|*"
      - "vCommunity|Storage Adapter|*"
      - "vCommunity|Storage Adapter:<hba>|*"
      - "vCommunity|Network|*"
      - "vCommunity|Network|Device:<vmnic>|*"
      - "vCommunity|Runtime|*"
      - "vCommunity|Hardware|*"
      - "vCommunity|Capability|*"
      - "vCommunity|ESXi Performance|*"
      - "vCommunity|Availability|*"
  - adapter_kind: VMWARE
    resource_kind: VirtualMachine
    identity: "VMEntityObjectID + VMEntityVCID"
    key_groups:
      - "vCommunity|Configuration|*"
      - "vCommunity|Guest|*"
      - "vCommunity|Guest OS|*"
      - "vCommunity|Runtime|*"
      - "vCommunity|Summary|*"
      - "vCommunity|Network|Network Adapters:<label>|*"
      - "vCommunity|Virtual Disk:<label>|*"
      - "vCommunity|Options|*"
      - "vCommunity|VM Performance|*"
      - "vCommunity|Guest OS Performance|*"
      - "vCommunity|VM Guest OS KPI"
  - adapter_kind: VMWARE
    resource_kind: Datastore
    identity: "VMEntityObjectID + VMEntityVCID"
    key_groups:
      - "vCommunity|Identifiers|*"
      - "vCommunity|Summary|*"
  - adapter_kind: VMWARE
    resource_kind: Datacenter
    identity: "VMEntityObjectID + VMEntityVCID (live-unproven: E1)"
    key_groups:
      - "vCommunity|Network|Total Network Speed Degradation"
  - adapter_kind: VMWARE
    resource_kind: vSphere World
    identity: "the one object of the kind; none or several: held back and counted"
    key_groups:
      - "vCommunity|*"
  - adapter_kind: Container
    resource_kind: Tier, BusinessService, Enterprise
    identity: "the Suite API resource id from the Container tree"
    key_groups:
      - "vCommunity|Business Application|*"
