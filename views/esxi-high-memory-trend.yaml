name: ESXi High Memory Trend
description: Trend line of ESXi high memory utilization. Because the very purpose memory is cache, having
  100% utilization is better than 99%. However, at 99.1% the ballooning process kicks in. This increases
  the risk of swapping and compression, which in turn increases the chance of memory contention.
