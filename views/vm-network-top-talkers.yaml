# Converted from vCommunity 0.8.1: content/reports/view - collection01/View - Collection01.xml
id: e597c7a0-9f72-5b63-94e5-4c28575c5a34
name: VM Network Top Talkers
description: Lists virtual machines whose average network throughput exceeds 12 over the last week, with
  20-second, 5-minute and 1-hour peak throughput in Gbit/s, peak packet rate, NIC count, IP address and
  datacenter.
data_type: list
presentation: list
subject:
  adapter_kind: VMWARE
  resource_kind: VirtualMachine
  filter:
  - - filter_type: metrics
      metric_key: net|usage_average
      condition: GREATER_THAN
      value: 12
      transform: AVG
      business_hours: false
time_window:
  unit: WEEKS
  count: 1
columns:
- attribute: net|20_sec_peak_usage_average
  display_name: 20-second Max
  unit: gbitsps
  roll_up_type: NONE
  roll_up_count: 0
  transformation: MAX
  sort: desc
  yellow_bound: 2.5
  orange_bound: 5
  red_bound: 10
  ascending_range: false
- attribute: net|usage_average
  display_name: 5 minute Max
  unit: gbitsps
  roll_up_type: NONE
  roll_up_count: 0
  transformation: MAX
  sort: desc
  yellow_bound: 1
  orange_bound: 2
  red_bound: 5
  ascending_range: false
- attribute: net|usage_average
  display_name: 1 hour Max
  unit: gbitsps
  roll_up_type: AVG
  roll_up_unit: HOURS
  roll_up_count: 1
  transformation: MAX
  yellow_bound: 0.25
  orange_bound: 0.5
  red_bound: 1
  ascending_range: false
- attribute: net|20_sec_peak_packetsPerSec
  display_name: 20-second Max PPS
  unit: auto
  roll_up_type: NONE
  roll_up_count: 0
  transformation: MAX
- attribute: summary|config|numEthernetCards
  display_name: No of NIC
  is_property: true
  roll_up_type: AVG
  roll_up_count: 0
  transformation: CURRENT
  yellow_bound: 2
  orange_bound: 4
  red_bound: 6
  ascending_range: false
- attribute: net:4000|ip_address
  display_name: IP Address
  is_property: true
  is_string_attribute: true
  roll_up_type: AVG
  roll_up_count: 0
  transformation: CURRENT
- attribute: summary|parentDatacenter
  display_name: Datacenter
  is_property: true
  is_string_attribute: true
  roll_up_type: AVG
  roll_up_count: 0
  transformation: CURRENT
page_size: 50
distribution_color: 6870C4
omit:
- include_resource_creation_time
