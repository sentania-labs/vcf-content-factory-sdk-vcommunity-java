- id: w32
  type: Heatmap
  title: Monster VM
  coords:
    w: 12
    x: 1
    h: 6
    y: 46
  description: 'While you''re bound to have large VM, they should be minimized as they can impact both
    capacity and performance.

    The heat map shows the large VM. Each box represents a VM, grouped by vSphere Cluster so you can see
    where they are. The box size represents the relative vCPU configured size among the VM, while the
    color represents the configured. memory.

    Pro Tip: configure the threshold'
  title_localized: Monster VM
  view_details: ''
  mode: all
  depth: 10
  self_provider: true
  configs:
  - name: VM
    adapter_kind: VMWARE
    resource_kind: VirtualMachine
    color_by:
      metric_key: mem|guest_provisioned
      label: Memory|Total Capacity (KB)
    size_by:
      metric_key: cpu|corecount_provisioned
      label: CPU|Provisioned vCPU(s) (vCPUs)
    group_by:
      adapter_kind: VMWARE
      resource_kind: ClusterComputeResource
      text: Cluster Compute Resource
      parent_text: vCenter
    color:
      thresholds:
        values:
        - 0
        - 50
        - 100
        colors:
        - '#41800E'
        - '#FFC60A'
        - '#E02200'
    solid_coloring: false
    focus_on_groups: true
    name_localized: VM
    name_orig: VM
    tag_filter: null
    custom_filter:
    - adapter_kind: VMWARE
      resource_kind: VirtualMachine
      conditions:
      - filter_type: metrics
        metric_key: cpu|corecount_provisioned
        metric_name: CPU|Provisioned vCPU(s)
        condition: GREATER_THAN
        value: 8
        string_metric: false
        metric_unit: vCPUs
    omit:
    - color_min_value
  ui:
    height: 0
    state: ''
    tab_id: true
    states:
    - key: perm_HeatMap_
      value: o%3A
    widget_id: true
