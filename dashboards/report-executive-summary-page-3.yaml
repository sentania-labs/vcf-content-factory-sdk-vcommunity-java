  title: Explanation
  coords:
    w: 4
    x: 9
    h: 6
    y: 1
  html: <div>The Summary table works in 2 steps. <br></div><div>First across time, then across VMs.</div><div><br></div><div>In
    the first step, each VM is measured across time. It calculates the VM memory contention (%) at the
    99th percentile of the reporting period. For example, if there are 100 data points, it takes the 99th
    worst data. <br></div><div><br></div><div>In the second step, it takes the average of all VMs. As
    a leading indicator, it also takes the worst of all these 99th percentile data.</div>
