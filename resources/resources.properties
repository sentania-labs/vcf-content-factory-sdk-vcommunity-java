# resources.properties: display strings for VCF Content Factory vCommunity.
# Keys are the integer nameKey values referenced in describe.xml; <key>.description
# is the text under a field. Never reuse a retired key for a different label.

1=VCF Content Factory vCommunity
2=vCenter Credential
3=vCenter User Name
4=vCenter Password
5=Windows User Name
6=Windows Password
7=VCF Content Factory vCommunity
8=vCenter Server
8.description=Name or address of the vCenter Server to collect from, as the collector should dial it. Where the certificate is checked, enter a name the certificate carries.
9=ESXi Advanced System Settings Config File
9.description=Name, without .xml, of the configuration file that lists the ESXi advanced system settings to publish as properties. The default file lists none: copy it, add the settings you want, and name your copy here.
10=ESXi Software Packages Config File
10.description=Name, without .xml, of the configuration file that lists the ESXi software packages (VIBs and drivers) whose installed version is published. The default file lists none: copy it and name your copy here.
11=VM Advanced Parameters Config File
11.description=Name, without .xml, of the configuration file that lists the VM advanced parameters (.vmx keys) to publish for every VM. Each entry adds one value per VM, so keep the list short.
12=VM Options Config File
12.description=Name, without .xml, of the configuration file that lists the VM configuration properties to publish, written as dotted property paths. An entry that is not a valid path is skipped and reported.
13=Port
13.description=HTTPS port of the vCenter. Change it only when the vCenter is reached through a proxy or load balancer on another port.
14=vCenter TLS Validation
14.description=How the vCenter certificate is treated. WARNING: with Trust on First Use the user name and password are sent before any certificate check, so a server that impersonates the vCenter would receive them. Enabled needs a certificate the collector trusts and that names the host entered. Pinned needs the certificate whose thumbprint is set in the next field.
15=vCenter Thumbprint (SHA-256)
15.description=Thumbprint of the vCenter certificate, SHA-256 (64 hex digits) or SHA-512 (128). Used only when vCenter TLS Validation is Pinned. Colons, dashes and spaces are ignored.
16=Cluster Check Period (hours)
16.description=Length of one cluster check window in hours, which is also how often a check result is produced.
17=01 hour
18=02 hours
19=04 hours
20=06 hours
21=08 hours
22=12 hours
23=24 hours
24=Cluster Check Time (UTC)
24.description=Time of day, as HH:MM in UTC, at which a cluster check window ends. Later windows end one period after it.
25=Cluster Check Worst Percent
25.description=Share of each window's worst samples, 0 to 50, set aside before the result is taken. With 0 the single worst sample is the result.
26=Monster VM CPU (% of host cores)
26.description=A VM whose vCPU count is above this percentage (1 to 100) of its host's physical cores counts as a CPU monster in the cluster risk score.
27=Monster VM Memory (% of host DRAM)
27.description=A VM whose memory is above this percentage (1 to 100) of its host's DRAM, or above the minimum in the next field when that is smaller, counts as a memory monster.
28=Monster VM Memory Minimum (GB)
28.description=Memory size in GB (1 or more) above which a VM is a memory monster on any host, however large the host is.
29=Windows Service Configuration File
29.description=Name, without .xml, of the configuration file that lists the Windows services to check inside guests. Read only when Guest OS Service Monitoring Status is Enabled, and needs the Windows credential.
30=Windows Event Log Configuration File
30.description=Name, without .xml, of the configuration file that lists the Windows event logs and event IDs to collect from guests. Read only when Windows Event Log Monitoring Status is Enabled, and needs the Windows credential.
31=Guest OS Service Monitoring Status
31.description=Enabled checks the listed Windows services inside each Windows VM through VMware Tools and publishes their state. Disabled skips it. Needs the Windows credential.
32=Guest File Transfer TLS Validation
32.description=How the ESXi host certificate is checked when files are transferred to and from a guest. Pinned compares it with the thumbprint the vCenter holds for the host, Strict also skips a host for which the vCenter holds none, Disabled checks nothing.
33=Windows Event Log Monitoring Status
33.description=Enabled collects the listed Windows events from each Windows VM through VMware Tools. Disabled skips it. Needs the Windows credential.
