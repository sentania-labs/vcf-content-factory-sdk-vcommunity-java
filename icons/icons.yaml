# Icon mapping for vcfcf_vcommunity. Keys are describe.xml ResourceKind keys;
# values resolve against this directory, then the builder's shared library.
#
# The three own kinds use the default icon until the builder has icon hints
# for them (a content library, a library item, a VM template); see the design's
# toolset gap T4.
adapter_kind_icon: adapter_instance.svg

resource_kinds:
  vcfcf_vcommunity: adapter_instance.svg      # adapter instance (type=7)
  vCommunityCollector: adapter_instance.svg   # the per-account collector object
  Content Library: default.svg
  Library Item: default.svg
  VM Template: default.svg
